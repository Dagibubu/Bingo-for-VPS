<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mella BINGO - Loading</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-secondary: #cbd5e0;
            --text-muted: #94a3b8;
            --radius-xl: 30px;
            --radius-full: 9999px;
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 30px rgba(102, 126, 234, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            transition: opacity 0.5s ease;
        }

        .splash {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 50%, #1e293b, #0f172a);
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Elements */
        .splash::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
        }

        .splash::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 70% 30%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            animation: rotate 25s linear infinite reverse;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .splash-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 60px 80px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            text-align: center;
            box-shadow: var(--shadow-xl), var(--shadow-glow);
            animation: fadeInScale 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 10;
            max-width: 600px;
            width: 90%;
        }

        .splash-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                var(--primary), 
                var(--secondary), 
                var(--accent), 
                var(--primary));
            border-radius: calc(var(--radius-xl) + 2px);
            z-index: -1;
            animation: borderGlow 3s linear infinite;
            opacity: 0.5;
        }

        @keyframes borderGlow {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 52px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.3)); }
            50% { filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.6)); }
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 18px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .loader {
            margin-top: 40px;
            width: 300px;
            height: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-full);
            overflow: hidden;
            position: relative;
            margin-left: auto;
            margin-right: auto;
        }

        .loader span {
            display: block;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, 
                var(--primary), 
                var(--secondary), 
                var(--accent), 
                var(--primary));
            background-size: 300% 100%;
            animation: load 3s linear forwards, gradientShift 1.5s linear infinite;
        }

        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .loader-text {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Cartelas Status */
        .cartelas-status {
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* Floating Bingo Balls */
        .floating-ball {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0.1;
            animation: floatBall 10s linear infinite;
        }

        @keyframes floatBall {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0.1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0.3; }
        }

        .badge-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 12px;
            margin-top: 20px;
        }

        .version {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: var(--text-muted);
            font-size: 12px;
            opacity: 0.5;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="splash">
        <!-- Animated floating balls -->
        <div class="floating-ball" style="left: 10%; animation-delay: 0s;"></div>
        <div class="floating-ball" style="left: 30%; width: 40px; height: 40px; animation-delay: 2s;"></div>
        <div class="floating-ball" style="left: 50%; width: 80px; height: 80px; animation-delay: 4s;"></div>
        <div class="floating-ball" style="left: 70%; width: 50px; height: 50px; animation-delay: 6s;"></div>
        <div class="floating-ball" style="left: 90%; animation-delay: 8s;"></div>
        
        <div class="splash-card">
            <img src="../assets/logo.png" alt="Mella BINGO" class="logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'150\' viewBox=\'0 0 150 150\'><rect width=\'150\' height=\'150\' fill=\'%2333666f1\'/><text x=\'75\' y=\'90\' font-family=\'Arial\' font-size=\'60\' fill=\'white\' text-anchor=\'middle\'>B</text></svg>'">
            
            <div class="title">MELLA BINGO</div>
            
            <div class="subtitle">
                <span class="shimmer" id="loadingMessage">Loading System...</span>
            </div>
            
            <!-- Cartelas Status -->
            <div id="cartelasStatus" class="cartelas-status" style="display: none;">
                <span id="cartelasIcon">🎴</span>
                <span id="cartelasText">Checking cartelas...</span>
            </div>
            
            <div class="loader" id="loader">
                <span></span>
            </div>
            
            <div class="loader-text" id="loaderText">
                Initializing System
            </div>
            
            <div class="badge-success" style="margin-top: 20px;">
                Version 2.0
            </div>
        </div>
        
        <div class="version">
            © 2026 MELLA BINGO - All Rights Reserved
        </div>
    </div>

    <script>
        let cartelasLoaded = false;

        // Load on page ready
        document.addEventListener('DOMContentLoaded', async () => {
            // Small delay to ensure API is ready
            setTimeout(async () => {
                await initializeSystem();
            }, 500);
        });

        // Initialize system
        async function initializeSystem() {
            try {
                const loaderText = document.getElementById('loaderText');
                const loadingMessage = document.getElementById('loadingMessage');
                const loader = document.getElementById('loader');
                
                loaderText.textContent = 'Loading System...';
                loadingMessage.textContent = 'Initializing...';
                
                // Check if API is available
                if (!window.api) {
                    console.error('API not available');
                    showErrorAndRetry();
                    return;
                }
                
                // Initialize database and check cartelas
                await checkCartelas();
                
            } catch (error) {
                console.error('Error initializing system:', error);
                document.getElementById('loaderText').textContent = 'Error Loading System';
                showErrorAndRetry();
            }
        }

        // Check cartelas status
        async function checkCartelas() {
            try {
                const cartelasStatus = document.getElementById('cartelasStatus');
                const cartelasIcon = document.getElementById('cartelasIcon');
                const cartelasText = document.getElementById('cartelasText');
                const loaderText = document.getElementById('loaderText');
                
                cartelasStatus.style.display = 'block';
                cartelasIcon.textContent = '🎴';
                cartelasText.textContent = 'Checking cartelas...';
                loaderText.textContent = 'Loading Cartelas...';
                
                // Get cartelas count from database
                const cartelas = await window.api.getAllCartelas();
                
                if (cartelas && cartelas.length > 0) {
                    cartelasLoaded = true;
                    cartelasIcon.textContent = '✅';
                    cartelasText.textContent = `${cartelas.length} cartelas loaded`;
                    
                    console.log(`✅ ${cartelas.length} cartelas available`);
                    
                    // After cartelas checked, continue to menu
                    setTimeout(() => {
                        navigateToMenu();
                    }, 2000);
                    
                } else {
                    cartelasIcon.textContent = '⚠️';
                    cartelasText.textContent = 'No cartelas found - will load on first game';
                    
                    console.log('⚠️ No cartelas found - they will load on first game');
                    
                    // Still continue to menu (cartelas will load when needed)
                    setTimeout(() => {
                        navigateToMenu();
                    }, 2000);
                }
                
            } catch (error) {
                console.error('Error checking cartelas:', error);
                const cartelasText = document.getElementById('cartelasText');
                cartelasText.textContent = 'Error checking cartelas';
                
                // Still continue to menu
                setTimeout(() => {
                    navigateToMenu();
                }, 2000);
            }
        }

        // Show error and retry button
        function showErrorAndRetry() {
            const loaderText = document.getElementById('loaderText');
            const loader = document.getElementById('loader');
            
            loaderText.textContent = 'Failed to load system';
            
            // Add retry button
            const retryBtn = document.createElement('button');
            retryBtn.textContent = '🔄 Retry';
            retryBtn.style.marginTop = '20px';
            retryBtn.style.padding = '10px 20px';
            retryBtn.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
            retryBtn.style.border = 'none';
            retryBtn.style.borderRadius = '10px';
            retryBtn.style.color = 'white';
            retryBtn.style.cursor = 'pointer';
            retryBtn.style.fontWeight = '600';
            retryBtn.onclick = () => {
                retryBtn.remove();
                location.reload();
            };
            
            document.querySelector('.splash-card').appendChild(retryBtn);
        }

        // Navigate to menu
        function navigateToMenu() {
            // Add fade out animation
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                window.location.href = 'menu.html';
            }, 500);
        }

        // Interactive loader text
        const messages = [
            'Loading System...',
            'Initializing Database...',
            'Loading Cartelas...',
            'Preparing Game Engine...',
            'Shuffling Numbers...',
            'Preparing Cards...',
            'Almost Ready...',
            'Welcome to Mella BINGO!'
        ];
        
        let index = 0;
        const loaderText = document.querySelector('.loader-text');
        
        // Cycle messages
        const messageInterval = setInterval(() => {
            index = (index + 1) % messages.length;
            if (loaderText && !loaderText.textContent.includes('Error')) {
                loaderText.style.opacity = '0';
                setTimeout(() => {
                    loaderText.textContent = messages[index];
                    loaderText.style.opacity = '1';
                }, 200);
            }
        }, 800);

        // Clean up interval on navigation
        window.addEventListener('beforeunload', () => {
            clearInterval(messageInterval);
        });
    </script>
</body>
</html>
