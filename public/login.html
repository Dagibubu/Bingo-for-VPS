<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP BINGO — Login</title>
    <script src="/js/api.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #ffffff;
            --bg-soft: #f8f9fa;
            --surface: #ffffff;
            --surface-hover: #f1f3f5;
            --border: #dee2e6;
            --border-focus: #5146b5;
            --text: #12122a;
            --muted: #6c757d;
            --primary: #5146b5;
            --primary-hover: #3d3494;
            --error: #dc3545;
            --error-bg: #f8d7da;
            --error-border: #f5c2c7;
            --pink: #d94ad6;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(101, 80, 237, 0.05) 0%, transparent 60%);
            animation: slowRotate 60s linear infinite;
            pointer-events: none;
        }

        @keyframes slowRotate { to { transform: rotate(360deg); } }

        .login-wrap {
            position: relative;
            width: 100%;
            max-width: 380px;
            z-index: 1;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6e5fe6, #5146b5);
            margin-bottom: 20px;
            font-size: 26px;
            color: white;
            box-shadow: 0 8px 24px rgba(101, 80, 237, 0.35);
        }

        .brand h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            color: var(--primary);
        }

        .brand h1 .spark { color: var(--pink); font-size: 20px; }

        .brand p {
            color: var(--muted);
            font-size: 14px;
        }

        form { display: flex; flex-direction: column; gap: 14px; }

        .field { position: relative; }

        .field input {
            width: 100%;
            padding: 14px 16px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .field input::placeholder { color: #adb5bd; }

        .field input:hover:not(:disabled):not(:focus) {
            border-color: #ced4da;
            background: var(--surface-hover);
        }

        .field input:focus {
            border-color: var(--border-focus);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(101, 80, 237, 0.12);
        }

        .field input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: var(--bg-soft);
        }

        .field.with-toggle input { padding-right: 48px; }

        .toggle-pwd {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
        }

        .toggle-pwd:hover {
            color: var(--text);
            background: var(--surface-hover);
        }

        button[type="submit"] {
            margin-top: 8px;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            color: #ffffff;
            background: linear-gradient(135deg, #6e5fe6, #5146b5);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            box-shadow: 0 6px 16px rgba(101, 80, 237, 0.35);
        }

        button[type="submit"]:hover:not(:disabled) {
            box-shadow: 0 10px 22px rgba(101, 80, 237, 0.45);
            transform: translateY(-1px);
        }

        button[type="submit"]:active:not(:disabled) { transform: scale(0.99); }
        button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

        .error {
            display: none;
            padding: 12px 14px;
            font-size: 13px;
            color: var(--error);
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 12px;
            margin-bottom: 4px;
        }

        .error.show {
            display: block;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .foot {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 400px) {
            .brand h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="brand">
            <h1><span class="spark"></span> VIP BINGO <span class="spark"></span></h1>
            <p>Sign in to continue</p>
        </div>

        <form id="loginForm" autocomplete="on">
            <div class="error" id="errorMsg"></div>

            <div class="field">
                <input type="email" id="email" name="email" placeholder="Email address"
                       autocomplete="username" required autofocus>
            </div>

            <div class="field with-toggle">
                <input type="password" id="password" name="password" placeholder="Password"
                       autocomplete="current-password" required>
                <button type="button" class="toggle-pwd" id="togglePwd" tabindex="-1" aria-label="Show password">👁</button>
            </div>

            <button type="submit" id="submitBtn">Sign in</button>
        </form>

        <div class="foot">Secured access · © 2026 VIP BINGO</div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorEl = document.getElementById('errorMsg');
        const toggleBtn = document.getElementById('togglePwd');
        let submitting = false;

        toggleBtn.addEventListener('click', () => {
            const isPwd = passwordInput.type === 'password';
            passwordInput.type = isPwd ? 'text' : 'password';
            toggleBtn.textContent = isPwd ? '🙈' : '👁';
            passwordInput.focus();
        });

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.add('show');
            errorEl.style.animation = 'none';
            void errorEl.offsetWidth;
            errorEl.style.animation = '';
        }
        function clearError() {
            errorEl.textContent = '';
            errorEl.classList.remove('show');
        }

        /* ============================================================ */
        /*  ROLE-BASED REDIRECT                                          */
        /*  Admin  → menu.html (dashboard)                               */
        /*  Cashier → menu.html (dashboard ONLY — no other pages)        */
        /* ============================================================ */
        function redirectAfterLogin(user) {
            const params = new URLSearchParams(window.location.search);
            let next = params.get('next');

            // Only admins may honor a "next" URL that isn't the dashboard
            const NON_DASHBOARD = [
                '/register.html',
                '/game.html',
                '/index.html',
                '/admin.html',
                '/settings.html',
                '/user_register.html',
                '/betsettings.html'
            ];

            if (user.role !== 'admin') {
                // Cashiers ALWAYS land on the dashboard, ignoring any next
                window.location.href = '/menu.html';
                return;
            }

            // Admins:
            if (!next) next = '/menu.html';

            // If somehow a non-admin-only page slipped in, fall back safely
            if (NON_DASHBOARD.includes(next) && user.role !== 'admin') {
                next = '/menu.html';
            }

            window.location.href = next;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (submitting) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            clearError();

            if (!email || !password) {
                showError('Please enter your email and password');
                return;
            }

            submitting = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in…';
            emailInput.disabled = true;
            passwordInput.disabled = true;

            try {
                const result = await window.api.login(email, password);

                if (result && result.success) {
                    submitBtn.textContent = 'Redirecting…';
                    redirectAfterLogin(result.user);
                    return;
                }

                showError(result?.error || 'Invalid email or password');
            } catch (err) {
                if (err.message === 'Unauthorized') {
                    showError('Invalid email or password');
                } else {
                    showError('Connection error. Please try again.');
                }
            } finally {
                submitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
                emailInput.disabled = false;
                passwordInput.disabled = false;
                passwordInput.focus();
            }
        });

        // Auto-redirect if already logged in
        (async () => {
            try {
                const me = await window.api.me();
                if (me?.success && me.user) {
                    redirectAfterLogin(me.user);
                }
            } catch { /* not logged in */ }
        })();
    </script>
    <script src="/js/pwa-refresh.js?v=20261108" defer></script>
</body>
</html>
